name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Create static landing artifact
        run: |
          mkdir -p site
          cat <<'EOF' > site/index.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>binbongcar</title>
            <style>
              body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0b1220;color:#e9eefb}
              main{max-width:880px;margin:48px auto;padding:0 20px}
              .card{border:1px solid #2a3a5a;background:#111b30;border-radius:14px;padding:20px}
              a{color:#9fc2ff}
            </style>
          </head>
          <body>
            <main>
              <h1>binbongcar</h1>
              <div class="card">
                <p>This repository now hosts scraper and data pipeline code.</p>
                <p>Build SHA: <code>${{ github.sha }}</code></p>
                <p>Repository: <a href="https://github.com/jakobtivell-cpu/binbongcar">github.com/jakobtivell-cpu/binbongcar</a></p>
              </div>
            </main>
          </body>
          </html>
          EOF
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_SKY_0E28A9F10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/site" # Generated static landing page
          api_location: "" # Api source code path - optional
          output_location: "" # No build output directory; deploy app_location directly
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_SKY_0E28A9F10 }}
          action: "close"
